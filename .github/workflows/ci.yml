name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app || xcodebuild -version

      # Sign ad hoc rather than not at all: the tests are hosted in the app, and
      # the runner hangs before connecting to a fully unsigned host.
      - name: Build and test
        run: |
          xcodebuild test \
            -scheme Prompter \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=
